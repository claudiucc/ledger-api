name: ledger-api

services:
  mysql:
    image: mysql:8.4
    container_name: ledger-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: passw0rd
      MYSQL_DATABASE: ledger_api
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassw0rd"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - ledger-net

  # Single-node Kafka in KRaft mode: no Zookeeper needed.
  kafka:
    image: apache/kafka:3.8.0
    container_name: ledger-kafka
    restart: unless-stopped
    ports:
      - "9094:9094" # host access, e.g. from a local kafka client or kcat
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: ledger-kafka-cluster-1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9092' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - ledger-net

  # --- Optional developer tools, started with `docker compose --profile tools up -d` ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ledger-kafka-ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ledger
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - ledger-net
    profiles: ["tools"]

  adminer:
    image: adminer:latest
    container_name: ledger-adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ledger-net
    profiles: ["tools"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ledger-api:local
    container_name: ledger-api
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ledger_api
      DB_USERNAME: root
      DB_PASSWORD: passw0rd
      DB_POOL_SIZE: 20
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ledger-net

networks:
  ledger-net:
    driver: bridge

volumes:
  mysql-data:

